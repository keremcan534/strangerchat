services:
  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgres://strangerchat:strangerchat@postgres:5432/strangerchat
    env_file:
      - path: .env
        required: false
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # Translation cache and counters only — losing them costs money, not data.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: strangerchat
      POSTGRES_PASSWORD: strangerchat
      POSTGRES_DB: strangerchat
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strangerchat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
