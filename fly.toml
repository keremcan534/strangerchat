# Fly.io deployment. Note that Fly no longer offers a free tier to new
# accounts — expect a couple of dollars a month for an always-on machine.

app = "strangerchat"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "3000"
  TRUST_PROXY = "true"

[http_service]
  internal_port = 3000
  force_https = true
  # Sleep when idle, wake on the next request, so an idle demo costs nothing.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
